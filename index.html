<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Duty (WD) Schedule</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cek Jadwal Work Duty</h1>
            <p>Masukkan ID Anda untuk melihat jadwal kebersihan</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Masukkan ID Siswa..." autocomplete="off">
            <button id="searchBtn">Jadwal Saya</button>
        </div>

        <!-- Loader -->
        <div id="loader" class="loader hidden"></div>

        <!-- Result Container -->
        <div id="resultContainer" class="result-container hidden">
            <!-- Data will be injected here by JS -->
        </div>

        <!-- Error Container -->
        <div id="errorContainer" class="error-container hidden">
            <p>Jadwal tidak ditemukan. Pastikan ID sudah benar.</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/member/main.js"></script>
</body>
</html>
